<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文档预览</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f5f7;
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; }
    #app { position: absolute; inset: 0; }
    #mask { position: absolute; inset: 0; z-index: 99; display: none;
      align-items: center; justify-content: center; background: #fff;
      flex-direction: column; gap: 14px; color: #5b636e; font-size: 13px; }
    #mask.on { display: flex; }
    #mask .sp { width: 30px; height: 30px; border: 3px solid #e6e8eb;
      border-top-color: #2f6feb; border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #wm { position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background-repeat: repeat; }
    /* 幻灯片翻页条（左侧页面列表关掉后由它接管翻页） */
    #kk-nav { position: fixed; right: 18px; bottom: 16px; z-index: 60;
      display: none; align-items: center; gap: 2px; padding: 4px 6px;
      background: rgba(255,255,255,.94); border: 1px solid #e3e6ea;
      border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
      font: 13px/1 -apple-system,"Microsoft YaHei","PingFang SC",sans-serif; color: #5b636e; }
    #kk-nav.on { display: flex; }
    #kk-nav button { width: 28px; height: 26px; border: 0; background: transparent;
      color: #444; font-size: 18px; line-height: 1; cursor: pointer; border-radius: 5px; }
    #kk-nav button:hover { background: #f0f2f5; }
    #kk-page { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
    /* 注: Univer 的滚动条是画在 canvas 里的(不是 DOM)，CSS 关不掉；
       它落在页面左右留白里，不影响正文 */
  </style>
  <script type="module" crossorigin src="/univer/assets/index-DNtlwfYD.js"></script>
  <link rel="modulepreload" crossorigin href="/univer/assets/univer-OWKm7rBf.js">
  <link rel="stylesheet" crossorigin href="/univer/assets/index-BlZ-hNDA.css">
</head>
<body>
  <div id="app"></div>
  <div id="mask" class="on">
    <div class="sp"></div>
    <div id="tip">正在加载文档…</div>
  </div>
</body>
</html>
