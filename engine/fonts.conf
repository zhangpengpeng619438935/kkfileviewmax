<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Excel 默认西文字体 Calibri -> Carlito(度量兼容, 列宽不变) -->
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit>
  </match>
  <!-- Office 中文默认字体等线 -> 微软雅黑(镜像已带) -->
  <match target="pattern">
    <test name="family"><string>等线</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Microsoft YaHei</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DengXian</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Microsoft YaHei</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>等线 Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Microsoft YaHei</string></edit>
  </match>
  <!-- 其它常见中文字体兜底 -->
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>仿宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <!-- Arial / Times New Roman 由 Liberation 系列自动匹配, 这里显式兜底 -->
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
</fontconfig>
